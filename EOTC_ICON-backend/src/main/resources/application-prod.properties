# Production / Docker: PostgreSQL only.
# All connection settings come from environment variables and are required —
# the application fails fast instead of falling back to H2.

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Set DB_DDL_AUTO=validate once schema migrations (Flyway) are introduced.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}

spring.h2.console.enabled=false
