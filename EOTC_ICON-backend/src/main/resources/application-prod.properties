# Production / Docker: PostgreSQL only.
# All connection settings come from environment variables and are required —
# the application fails fast instead of falling back to H2.

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway (db/migration) owns the production schema; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=false
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.storage.provider=local
app.storage.local-root=${STORAGE_LOCAL_ROOT}
