# Docker Compose (local development / staging): PostgreSQL.
# Activated with SPRING_PROFILES_ACTIVE=docker.
#
# The connection details always come from the environment, so the same image
# can talk to the compose database, a managed instance, or CI. The
# `PostgresDatabaseConfig` validator fails fast when one of them is missing.

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway (db/migration) owns the schema; Hibernate only validates it.
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# The H2 console is only ever enabled by the `local` profile.
spring.h2.console.enabled=false

server.port=${SERVER_PORT:8080}

# Compose uses persistent filesystem media storage. Keep this volume mounted
# between backend container replacements.
app.storage.provider=local
app.storage.local-root=${STORAGE_LOCAL_ROOT:/var/lib/eotcicon/media}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
