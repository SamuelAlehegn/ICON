# Docker Compose (local development / staging): PostgreSQL.
# Activated with SPRING_PROFILES_ACTIVE=docker.
#
# The connection details always come from the environment, so the same image
# can talk to the compose database, a managed instance, or CI. The
# `PostgresDatabaseConfig` validator fails fast when one of them is missing.

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway (db/migration) owns the schema; Hibernate only validates it.
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# The H2 console is only ever enabled by the `local` profile.
spring.h2.console.enabled=false

server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Storage
# Reserved for the S3/MinIO storage provider. The backend does not read these
# properties yet — the storage abstraction is not implemented — but they are
# declared here so the compose file and the deployed container share one
# source of truth.
# ---------------------------------------------------------------------------
app.storage.provider=${STORAGE_PROVIDER:s3}
app.storage.local-root=${STORAGE_LOCAL_ROOT:./data/media}
app.storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/eotc-media}
app.storage.s3.endpoint=${S3_ENDPOINT:http://minio:9000}
app.storage.s3.bucket=${S3_BUCKET:eotc-media}
app.storage.s3.access-key=${S3_ACCESS_KEY:minioadmin}
app.storage.s3.secret-key=${S3_SECRET_KEY:minioadmin}
