spring.application.name=EOTC_ICON-backend

# Database configuration
#   local -> in-memory H2 database 
#   prod  -> PostgreSQL 
# The default (no profile set) is PostgreSQL, matching production.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eotc_archive}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:eotc}
spring.datasource.password=${DB_PASSWORD:eotc}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# The H2 console is only enabled by the `local` profile.
spring.h2.console.enabled=false
