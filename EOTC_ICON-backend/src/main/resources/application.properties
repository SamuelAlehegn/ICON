spring.application.name=EOTC_ICON-backend

# Dev: expose the H2 console without authentication
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Dev: use an in-memory H2 database
spring.datasource.url=jdbc:h2:mem:eotcicon
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dev: let Hibernate create/update the schema in memory
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

