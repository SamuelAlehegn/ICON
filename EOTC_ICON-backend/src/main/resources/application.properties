spring.application.name=EOTC_ICON-backend

# ---------------------------------------------------------------------------
# Database profiles
#   local (default) -> in-memory H2, no Docker/PostgreSQL required
#   prod            -> PostgreSQL via DB_URL / DB_USERNAME / DB_PASSWORD
# Activate with SPRING_PROFILES_ACTIVE=prod (production / Docker).
# ---------------------------------------------------------------------------
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# The H2 console is only enabled by the `local` profile.
spring.h2.console.enabled=false
