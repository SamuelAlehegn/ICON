spring.application.name=EOTC_ICON-backend

# ---------------------------------------------------------------------------
# Database profiles
#   local (default) -> H2, no Docker/PostgreSQL required
#   docker          -> PostgreSQL via DB_URL / DB_USERNAME / DB_PASSWORD
#   prod            -> PostgreSQL via DB_URL / DB_USERNAME / DB_PASSWORD
# Activate with SPRING_PROFILES_ACTIVE=docker (Docker Compose) or
# SPRING_PROFILES_ACTIVE=prod (production).
# ---------------------------------------------------------------------------
spring.profiles.default=local

# Flyway owns the schema in every profile; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# PostgreSQL migration set; the `local` profile swaps in the H2 mirror (db/h2).
spring.flyway.locations=classpath:db/migration

# The H2 console is only enabled by the `local` profile.
spring.h2.console.enabled=false

# CORS configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.jwt.secret=${JWT_SECRET:change-me-in-prod-change-me-in-prod-change-me}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
app.storage.local-root=${STORAGE_LOCAL_ROOT:./data/media}

# Request limits should match the reverse proxy's body-size limit.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=25MB
