# Local development: H2 in PostgreSQL-compatibility mode.
# No Docker or PostgreSQL required.
#
# In-memory by default — the data is discarded when the app stops. Set H2_URL
# to keep the data between restarts, e.g.
#   H2_URL=jdbc:h2:file:./data/eotcicon;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH

spring.datasource.url=${H2_URL:jdbc:h2:mem:eotcicon;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=eotcicon
spring.datasource.password=

# H2 migration set — a hand-maintained mirror of db/migration (see README).
spring.flyway.locations=classpath:db/h2

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${SERVER_PORT:8080}
