# Local development: in-memory H2 in PostgreSQL-compatibility mode.
# No Docker or PostgreSQL required; data is discarded on shutdown.

spring.datasource.url=jdbc:h2:mem:eotcicon;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=eotcicon
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
