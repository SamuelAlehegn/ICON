# Local integration stack: PostgreSQL, the Spring API, and the Angular site.
# This file is for development/demo use, not a production deployment manifest.
name: eotc-icon

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-eotcicon}
      POSTGRES_USER: ${DB_USERNAME:-eotcicon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eotcicon}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-eotcicon} -d ${DB_NAME:-eotcicon}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./EOTC_ICON-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-eotcicon}
      DB_USERNAME: ${DB_USERNAME:-eotcicon}
      DB_PASSWORD: ${DB_PASSWORD:-eotcicon}
      JWT_SECRET: ${JWT_SECRET:-local-compose-only-change-this-secret-before-deployment}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_ROOT: /var/lib/eotcicon/media
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - media-data:/var/lib/eotcicon/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./EOTC_ICON-UI
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  media-data:
