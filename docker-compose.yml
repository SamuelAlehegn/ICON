# ---------------------------------------------------------------------------
# EOTC Sacred Icons Archive — local development stack.
#
#   docker compose up --build
#
# Services:
#   postgres   PostgreSQL 16 — the database Flyway migrates on startup
#   minio      S3-compatible object storage for the media archive
#   minio-init one-shot job that creates the media bucket
#   backend    Spring Boot API (SPRING_PROFILES_ACTIVE=docker -> PostgreSQL)
#   frontend   Nginx serving the Angular bundle, proxying /api to the backend
#
# Every value can be overridden in a .env file next to this one; see
# .env.example for the full list.
# ---------------------------------------------------------------------------
name: eotc-icon

services:
  postgres:
    image: postgres:16-alpine
    container_name: eotc-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-eotcicon}
      POSTGRES_USER: ${DB_USERNAME:-eotcicon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eotcicon}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-eotcicon} -d ${DB_NAME:-eotcicon}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: eotc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # curl is present in the MinIO image; the /dev/tcp fallback only needs bash.
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1 || bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: eotc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # MC_HOST_<alias> lets `mc` authenticate without an interactive login.
      MC_HOST_local: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin}@minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-eotc-media}
    entrypoint: >
      /bin/sh -c "
      mc mb --ignore-existing local/${MINIO_BUCKET:-eotc-media} &&
      mc anonymous set download local/${MINIO_BUCKET:-eotc-media} &&
      echo 'MinIO bucket ${MINIO_BUCKET:-eotc-media} is ready'"
    restart: "no"

  backend:
    build:
      context: ./EOTC_ICON-backend
    container_name: eotc-backend
    environment:
      # `docker` is a PostgreSQL profile: the connection details come from the
      # environment and the app refuses to start without them.
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-eotcicon}
      DB_USERNAME: ${DB_USERNAME:-eotcicon}
      DB_PASSWORD: ${DB_PASSWORD:-eotcicon}
      # Media storage (MinIO over the compose network).
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${MINIO_BUCKET:-eotc-media}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:9000/eotc-media}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./EOTC_ICON-UI
    container_name: eotc-frontend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
