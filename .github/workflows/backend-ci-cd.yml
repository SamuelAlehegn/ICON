name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "EOTC_ICON-backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "EOTC_ICON-backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: EOTC_ICON-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: EOTC_ICON-backend/pom.xml

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: eotc-icon-backend-jar
          path: EOTC_ICON-backend/target/*.jar
          if-no-files-found: error
